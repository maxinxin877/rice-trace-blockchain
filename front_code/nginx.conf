# =====================================================================
# Nginx 站点配置（挂载/复制到 /etc/nginx/conf.d/default.conf）
# 职责：1) 托管前端静态资源  2) 把 /api/ 反向代理到后端容器
# 同源部署，前端 request.ts 使用相对路径 /api/v1，因此不存在跨域问题。
# =====================================================================

upstream qukuailian_backend {
    server app:8080;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;

    # 上传限制：与后端 spring.servlet.multipart.max-file-size(50MB) 对齐，
    # 否则 Nginx 默认 1MB 会先返回 413，前端表现为"上传失败"。
    client_max_body_size 50m;

    # ---------- 压缩 ----------
    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # ---------- 容器健康检查 ----------
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    # ---------- 后端接口反向代理 ----------
    # /api/v1/... -> http://app:8080/api/v1/...（后端 context-path 为 /api/v1）
    location /api/ {
        proxy_pass http://qukuailian_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        # 文件上传/下载、批量生成防伪码等操作留足时间
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }

    # ---------- 带内容哈希的构建产物：长期缓存 ----------
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ---------- index.html 不缓存，保证发版后立即生效 ----------
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # ---------- 其余路径回退到前端入口（本项目为 hash 路由，/ 即可） ----------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---------- 基础安全响应头 ----------
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}

