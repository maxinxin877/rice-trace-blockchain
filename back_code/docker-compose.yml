# =====================================================================
# 水稻产品质量安全溯源系统 —— 一键部署编排
#   服务：mysql + redis + app(Spring Boot) + web(Nginx + 前端静态资源)
#
# 使用步骤：
#   1) cp .env.example .env  并按需修改（数据库密码、JWT 密钥、对外端口）
#   2) docker compose up -d --build        # 首次构建约 5~15 分钟
#   3) 浏览器访问 http://<服务器IP>/        # 前端页面（含扫码溯源页）
#   4) 直接调接口：http://<服务器IP>/api/v1/... （经 Nginx 反代到后端）
#
# 端口策略：只有 web 暴露到公网；MySQL/Redis 仅容器网络内可达，
# 后端 8080 仅绑定宿主机 127.0.0.1（需要时用 SSH 隧道调试）。
# =====================================================================
name: rice-trace

services:

  # ---------------- MySQL 8 ----------------
  mysql:
    image: mysql:8.0
    container_name: rice-mysql
    restart: unless-stopped
    environment:
      # 必填：在 back_code/.env 中设置（缺失则 compose 直接报错退出）
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?}
      MYSQL_DATABASE: qukuailian
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --default-time-zone=+08:00
      - --max_connections=300
    volumes:
      - mysql-data:/var/lib/mysql
      # 仅在数据卷为空（首次启动）时自动执行建库建表 + 初始账号
      - ./sql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - rice-net

  # ---------------- Redis（技术栈要求；业务为弱依赖，也可省略） ----------------
  redis:
    image: redis:7-alpine
    container_name: rice-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - rice-net

  # ---------------- 后端 Spring Boot ----------------
  app:
    build:
      context: .
      args:
        MAVEN_MIRROR: ${MAVEN_MIRROR:-https://maven.aliyun.com/repository/public}
    image: rice-trace-backend:latest
    container_name: rice-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/qukuailian?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:?}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      # 必填：HS384 签名密钥，长度必须 >= 48 字节（缺失则 compose 直接报错退出）
      APP_JWT_SECRET: ${JWT_SECRET:?}
      # 上传目录（容器内绝对路径，已挂载数据卷）
      APP_FILE_UPLOAD_DIR: /app/upload
      # FISCO BCOS：默认 false = 不连链，上链模拟成功
      BCOS_ENABLED: ${BCOS_ENABLED:-false}
      BCOS_CONFIG_FILE: /app/bcos/config.toml
      BCOS_CONTRACT_ADDRESS: ${BCOS_CONTRACT_ADDRESS:-}
      JAVA_OPTS: ${JAVA_OPTS:--XX:MaxRAMPercentage=75 -Duser.timezone=Asia/Shanghai -Dfile.encoding=UTF-8}
      TZ: Asia/Shanghai
    volumes:
      - upload-data:/app/upload
    ports:
      # 仅本机可访问，便于 SSH 隧道调试；不需要可整段删除
      - "127.0.0.1:8080:8080"
    networks:
      - rice-net

  # ---------------- 前端 + Nginx ----------------
  web:
    build:
      context: ../front_code
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
    image: rice-trace-frontend:latest
    container_name: rice-web
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "${HTTP_PORT:-80}:80"
    networks:
      - rice-net

volumes:
  mysql-data:
  redis-data:
  upload-data:

networks:
  rice-net:
    driver: bridge
