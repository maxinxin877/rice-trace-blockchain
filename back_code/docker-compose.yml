# =====================================================================
# 一键部署：MySQL + Redis + 后端服务 + Nginx
# 使用：
#   docker compose up -d --build
# 访问：http://localhost（前端） / http://localhost/api/...（后端 API）
# =====================================================================
services:
  mysql:
    image: mysql:8.0
    container_name: qukuailian-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root123456
      MYSQL_DATABASE: qukuailian
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # 首次启动自动执行建库脚本（仅空数据卷时生效）
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot123456"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: qukuailian-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: qukuailian-app
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Spring Boot 环境变量覆盖 application.yml（无需 docker profile）
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/qukuailian?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root123456
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      # FISCO BCOS 接入开关（搭好链并部署 Evidence 合约后打开，并配置合约地址）
      BCOS_ENABLED: "false"
      BCOS_CONFIG_FILE: /app/bcos/config.toml
      BCOS_CONTRACT_ADDRESS: ""
    ports:
      - "8080:8080"

  nginx:
    image: nginx:1.27-alpine
    container_name: qukuailian-nginx
    depends_on:
      - app
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # 前端构建产物（Vue 等）放在 frontend/dist 下
      - ./frontend/dist:/usr/share/nginx/html:ro

volumes:
  mysql-data:
  redis-data:
